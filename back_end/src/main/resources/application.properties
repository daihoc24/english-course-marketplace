spring.application.name=back_end
spring.config.import=optional:file:./.env[.properties],optional:file:./back_end/.env[.properties]
server.port=${PORT:${SERVER_PORT:8080}}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.servlet.context-path=/api
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:20}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:false}
spring.data.jpa.repositories.bootstrap-mode=${SPRING_DATA_JPA_REPOSITORIES_BOOTSTRAP_MODE:default}
spring.jmx.enabled=${SPRING_JMX_ENABLED:false}

# Database credentials must be supplied by the runtime environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tmdt?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:600000}

# Use Flyway migrations in production. `update` is allowed only in an explicitly configured local environment.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:false}

jwt.signer-key=${JWT_SIGNER_KEY}
jwt.valid-duration=${JWT_VALID_DURATION:3600}
jwt.refreshable-duration=${JWT_REFRESHABLE_DURATION:36000}

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:1GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:1025MB}
app.video.max-upload-bytes=${MAX_VIDEO_UPLOAD_BYTES:1073741824}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.return-url=${PAYPAL_RETURN_URL}
paypal.vnd-to-usd-rate=${PAYPAL_VND_TO_USD_RATE:25000.0}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.public-api-base-url=${PUBLIC_API_BASE_URL:http://localhost:8080/api}
app.payout.auto-enabled=${PAYOUT_AUTO_ENABLED:false}
app.payout.auto-cron=${PAYOUT_AUTO_CRON:0 0 2 * * *}
app.payout.auto-zone=${PAYOUT_AUTO_ZONE:Asia/Ho_Chi_Minh}
